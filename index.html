<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Save the Date</title>

<link href="https://fonts.googleapis.com/css?family=Arvo" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Dancing+Script&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* 🔥 disable text selection everywhere */
body, * {
    user-select: none;
    -webkit-user-select: none;
}

body {
    font-family: Arial, sans-serif;
    background: url('./assets/img/bg-2.jpg') bottom / cover no-repeat fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100dvh;
    padding: 10px;
    overflow: hidden;
}

/* CONTAINER */
.container {
    width: 100%;
    max-width: 520px;
    background: rgba(245,245,220,0.8);
    padding: 22px 18px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 8px 28px rgba(0,0,0,0.28);

    display: flex;
    flex-direction: column;
    gap: 14px;

    animation: fadeIn 1.2s ease;
}

/* LANGUAGE */
.lang-switch {
    text-align: right;
}

.lang-switch button {
    border: none;
    background: none;
    cursor: pointer;
    font-weight: bold;
}

/* MAP */
.map-circle {
    width: min(210px, 60vw);
    height: min(210px, 60vw);
    margin: 0 auto;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid #8b4513;

    animation: float 4s ease-in-out infinite;
}

.map-circle iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* TITLE */
.save-the-date {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(26px, 5vw, 40px);
    color: #2d5016;
}

/* CALENDAR */
.calendar {
    background: white;
    padding: 8px;
    border-radius: 10px;
    border: 2px solid #8b4513;
}

.weekdays {
    display: grid;
    grid-template-columns: repeat(7,1fr);
    font-size: clamp(10px,2.5vw,14px);
    font-weight: 700; /* 🔥 bolder */
    color: #5a3b1e; /* slightly darker */
    margin-bottom: 4px;
}

.days {
    display: grid;
    grid-template-columns: repeat(7,1fr);
    font-size: clamp(9px,2.5vw,13px);
}

.days div.highlighted {
    background: #228B22;
    color: white;
    border-radius: 50%;
}

/* BUTTON ROW */
.button-row {
    display: flex;
    gap: 10px;
}

.button-row button {
    flex: 1;
    padding: 10px;
    border-radius: 18px;
    border: none;
    cursor: pointer;
    font-size: clamp(12px,3vw,14px);
    transition: 0.3s;
}

.save-btn {
    background: #228B22;
    color: white;
}

.map-btn {
    background: #8b4513;
    color: white;
}

.button-row button:hover {
    transform: scale(1.05);
}

/* TEXT */
.footer-text {
    font-family: 'Dancing Script';
    font-size: clamp(16px,4vw,22px);
    line-height: 1.35;
}

.footer-text::after {
    content: "";
    display: block;
    width: 40%;
    height: 1px;
    background: rgba(0,0,0,0.15);
    margin: 8px auto 0;
}

.names {
    font-family: 'Dancing Script';
    font-size: clamp(22px,5vw,28px);
    color: #6b3e26;
    margin-top: 6px;
    letter-spacing: 0.5px;
}

.calendar-header {
    font-family: 'Arvo', serif;
    font-size: 18px;
    color: #228B22;
    margin-bottom: 8px;
    font-weight: bold;
}

/* HEART ANIMATION */
.heart {
    display: inline-block;
    animation: heartbeat 1.6s infinite;
}

/* ANIMATIONS */
@keyframes fadeIn {
    from {opacity:0; transform:scale(0.95);}
    to {opacity:1; transform:scale(1);}
}

@keyframes float {
    0%,100% {transform: translateY(0);}
    50% {transform: translateY(-6px);}
}
@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    40% { transform: scale(1); }
    60% { transform: scale(1.1); }
}
</style>
</head>

<body>

<div class="container">

    <div class="lang-switch">
        <button onclick="setLang('de')">DE</button> |
        <button onclick="setLang('en')">EN</button>
    </div>

    <div class="map-circle">
        <iframe src="https://maps.google.com/maps?q=50.671868284110005,7.222807890730933&output=embed&t=k"></iframe>
    </div>

    <div class="save-the-date"
        data-de="Save the Date"
        data-en="Save the Date"></div>

    <div class="calendar">
        <div class="calendar-header"
            data-de="Juni 2027"
            data-en="June 2027">
        </div>
        <div class="weekdays">
            <div>MO</div><div>DI</div><div>MI</div>
            <div>DO</div><div>FR</div><div>SA</div><div>SO</div>
        </div>

        <div class="days">
            <div></div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div>
            <div>7</div><div>8</div><div>9</div><div>10</div><div>11</div><div>12</div><div>13</div>
            <div>14</div><div>15</div><div>16</div><div>17</div><div>18</div><div>19</div><div>20</div>
            <div>21</div><div>22</div><div>23</div><div>24</div>
            <div class="highlighted">25</div>
            <div>26</div><div>27</div><div>28</div><div>29</div><div>30</div>
        </div>
    </div>

    <div class="button-row">
        <button class="save-btn" onclick="saveToCalendar()"
            data-de="Speichern"
            data-en="Save"></button>

        <button class="map-btn" onclick="openMaps()"
            data-de="Karte öffnen"
            data-en="Open Map"></button>
    </div>

    <div class="footer-text"
        data-de="Wir sagen ja <span class='heart'>♥</span><br>Reserviert diesen Termin.<br>Details folgen."
        data-en="We are getting married <span class='heart'>♥</span><br>Save the date.<br>Details soon.">
    </div>

    <div class="names">Nina & Mohyiddine</div>

</div>

<!-- 🎵 AUDIO -->
<audio id="bgMusic" src="./assets/mp3/music.mp3" autoplay loop></audio>

<script>
function setLang(lang) {
    document.querySelectorAll("[data-de]").forEach(el => {
        el.innerHTML = el.getAttribute("data-" + lang);
    });
}
setLang("de");

/* CALENDAR */
function saveToCalendar() {
    const ics = `BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
SUMMARY:Wedding Nina & Mohyiddine
LOCATION:Milchhäuschen Königswinter
DTSTART:20270624T190000
DTEND:20270625T020000
END:VEVENT
END:VCALENDAR`;

    const blob = new Blob([ics], {type:'text/calendar'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'wedding.ics';
    link.click();
}

/* MAP */
function openMaps() {
    window.open("https://www.google.com/maps?q=50.671868284110005,7.222807890730933");
}

/* 🔥 AUTOPLAY FALLBACK */
const audio = document.getElementById("bgMusic");

audio.volume = 0;

function fadeInAudio() {
    let vol = 0;
    const target = 0.5;

    const interval = setInterval(() => {
        if (vol < target) {
            vol += 0.02;
            audio.volume = vol;
        } else {
            clearInterval(interval);
        }
    }, 100);
}

/* autoplay attempt */
audio.play().then(fadeInAudio).catch(() => {
    document.addEventListener("click", () => {
        audio.play().then(fadeInAudio);
    }, { once: true });
});
</script>

</body>
</html>
